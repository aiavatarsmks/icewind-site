  <style>
    :root{color-scheme:dark;--bg:#050b16;--panel:#0a1830;--line:rgba(125,211,252,.25);--ice:#7dd3fc;--frost:#e0f2fe;--text:#dbe7f4;--muted:#9fb0c4}
    *{box-sizing:border-box}
    html{min-height:100%}
    body{min-height:100vh;min-height:100svh;margin:0;display:flex;flex-direction:column;background:radial-gradient(900px 420px at 50% -12%,rgba(56,189,248,.13),transparent 70%),var(--bg);background-color:var(--bg)!important;color:var(--text);font:400 16px/1.55 Inter,system-ui,sans-serif}
    a{color:var(--ice);text-underline-offset:3px}
    a:focus-visible{outline:3px solid var(--ice);outline-offset:4px;border-radius:3px}
    .wrap{width:min(1200px,calc(100% - 40px));margin-inline:auto}
    .site-header{border-bottom:1px solid var(--line);background:rgba(5,11,22,.78)}
    .header-inner{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{color:var(--frost);font:700 1.08rem/1 'Space Grotesk',sans-serif;letter-spacing:.2em;text-decoration:none;white-space:nowrap}
    .privacy-link{font-size:.9rem;white-space:nowrap}
    main{flex:1;display:flex;flex-direction:column;padding-block:28px 24px}
    h1{margin:0 0 20px;color:var(--frost);font:700 clamp(1.75rem,4vw,2.5rem)/1.2 'Space Grotesk',sans-serif}
    .chat-mount{flex:1;min-height:calc(100svh - 190px);display:grid;place-items:center;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(148,199,255,.065),rgba(148,199,255,.015));overflow:auto}
    #twilio-webchat-widget-root{width:100%;height:100%}
    #twilio-webchat-widget-root div:has(> [data-testid="root-container"]){position:relative!important;inset:auto!important;width:100%!important;height:100%!important;min-height:calc(100svh - 190px)!important;max-height:none!important}
    #twilio-webchat-widget-root [data-testid="root-container"],#twilio-webchat-widget-root [data-testid="root-container"]>div{width:100%!important;height:100%!important;max-height:none!important}
    #twilio-webchat-widget-root [data-testid="entry-point-button"],#twilio-webchat-widget-root [aria-label="Minimize chat"]{display:none!important}
    .site-footer{padding:15px 0 20px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}
    .footer-inner{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    @media(max-width:600px){.wrap{width:calc(100% - 28px)}.header-inner{min-height:62px;gap:12px}.brand{font-size:.94rem;letter-spacing:.13em}.privacy-link{font-size:.82rem}main{padding-block:20px 16px}h1{margin-bottom:16px}.chat-mount{min-height:calc(100svh - 168px);border-radius:14px}#twilio-webchat-widget-root div:has(> [data-testid="root-container"]){min-height:calc(100svh - 168px)!important}.site-footer{padding-bottom:max(16px,env(safe-area-inset-bottom))}}

  <header class="site-header">

    </div>
  </header>

  <main class="wrap">
    <h1>Chat with ICE WIND</h1>
    <div id="twilio-webchat-root" class="chat-mount" aria-label="ICE WIND chat area">
      <!-- TWILIO FLEX WEBCHAT 3.x: BODY EMBED START -->
      <div id="twilio-webchat-widget-root"></div>
      <script>
        window.addEventListener("load", () => {
          const isRussian = navigator.language.toLowerCase().startsWith("ru");
          const appConfig = {
            deploymentKey: "CVf1caf08111989b7ef6469a75af1ae695",
            appStatus: "open",
            preEngagementConfig: {
              title: isRussian ? "Начните чат с ICE WIND" : "Start a chat with ICE WIND",
              description: isRussian
                ? "🌐 Пишите на любом языке — мы ответим на том же языке."
                : "🌐 Write in any language — we’ll reply in the same language.",
              submitLabel: isRussian ? "Начать чат" : "Start chat",
              fields: [
                {
                  label: isRussian ? "Имя" : "Name",
                  type: "InputItem",
                  attributes: {
                    name: "friendlyName",
                    type: "text",
                    placeholder: isRussian ? "Ваше имя" : "Your name",
                    required: true
                  }
                },
                {
                  label: isRussian ? "Email" : "Email address",
                  type: "InputItem",
                  attributes: {
                    name: "email",
                    type: "email",
                    placeholder: "you@example.com",
                    required: true
                  }
                },
                {
                  label: isRussian ? "Ваш вопрос" : "Your question",
                  type: "TextareaItem",
                  attributes: {
                    name: "query",
                    type: "text",
                    placeholder: isRussian
                      ? "Расскажите, что вам нужно — по-русски, по-английски или на любом другом языке."
                      : "Tell us what you need — English, Russian, or any language.",
                    required: true
                  }
                }
              ]
            }
          };
          Twilio.initWebchat(appConfig);
        });
      </script>
      <!-- TWILIO FLEX WEBCHAT 3.x: BODY EMBED END -->
    </div>
  </main>
